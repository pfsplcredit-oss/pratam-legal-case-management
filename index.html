<script>


const SUPABASE_URL =
"https://tawykarkhepvtaxnxxjd.supabase.co";


const SUPABASE_KEY =
"sb_publishable_UbXEMo3CGKj6LbSu98xfFg_rvf2-kn_";

const BACKEND_URL =
"https://pratam-legal-case-management.onrender.com";
let allCases = [];

let activeFilters = {};



/* LOGIN */

async function login() {

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;


const response = await fetch(

SUPABASE_URL +
"/auth/v1/token?grant_type=password",

{
method: "POST",

headers: {
"apikey": SUPABASE_KEY,
"Content-Type": "application/json"
},

body: JSON.stringify({
email: email,
password: password
})

}

);


const data =
await response.json();


if (!response.ok) {

document.getElementById("loginMessage").innerText =
"Login failed. Please check your email and password.";

return;

}


localStorage.setItem(
"access_token",
data.access_token
);


document.getElementById("login").style.display =
"none";

document.getElementById("system").style.display =
"block";


showAllCases();

}



/* LOAD CASES */

async function showAllCases() {

const token =
localStorage.getItem("access_token");


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/legal_cases?select=*",

{
headers: {
"apikey": SUPABASE_KEY,
"Authorization": "Bearer " + token
}
}

);


const cases =
await response.json();


if (!response.ok) {

document.getElementById("cases").innerHTML =
"<div class='no-data'>Unable to load cases.</div>";

return;

}


allCases = cases;

displayCases(allCases);

}

/* UNIQUE OPTIONS */

function uniqueOptions(field) {

const values =
[...new Set(

allCases
.map(c => c[field])
.filter(Boolean)

)]


.sort();


return values.map(function(value) {

return `
<option value="${escapeHtml(value)}">
${escapeHtml(value)}
</option>
`;

}).join("");

}



/* OPEN FILTER */

function openFilter(field) {

document.querySelectorAll(".filter-menu")
.forEach(function(menu) {

menu.style.display = "none";

});


const menu =
document.getElementById(
"filter-" + field
);


if (menu) {

menu.style.display = "block";

}

}



/* APPLY COLUMN FILTER */

function applyColumnFilter(field) {

const input =
document.getElementById(
"input-" + field
);


if (!input) return;


activeFilters[field] =
input.value
.toLowerCase()
.trim();


applyFilters();

}



/* APPLY ALL FILTERS */

function applyFilters() {

    let filtered = [...allCases];

    /* GLOBAL SEARCH */

    const searchText =
        document.getElementById("globalSearch")
        .value
        .trim()
        .toLowerCase();

    if (searchText) {

        filtered = filtered.filter(function(row) {

            return (
                String(row.loan_no || "")
                    .toLowerCase()
                    .includes(searchText)

                ||

                String(row.first_party || "")
                    .toLowerCase()
                    .includes(searchText)

                ||

                String(row.second_party || "")
                    .toLowerCase()
                    .includes(searchText)

                ||

                String(row.case_no || "")
                    .toLowerCase()
                    .includes(searchText)

                ||

                String(row.cnr_number || "")
                    .toLowerCase()
                    .includes(searchText)
            );

        });

    }


    /* COLUMN FILTERS */

    Object.keys(activeFilters).forEach(function(field) {

        const filterValue =
            String(activeFilters[field] || "")
            .trim()
            .toLowerCase();

        if (!filterValue) {
            return;
        }


        filtered = filtered.filter(function(row) {

            const caseValue = row[field];


            /* EMPTY VALUE */

            if (
                caseValue === null ||
                caseValue === undefined
            ) {
                return false;
            }


            /* DATE FILTER */

            if (
                field === "previous_date" ||
                field === "next_date"
            ) {

                const dateValue =
                    String(caseValue)
                    .substring(0, 10);

                return dateValue === filterValue;

            }


            /* NORMAL FILTER */

            return String(caseValue)
                .toLowerCase()
                .includes(filterValue);

        });

    });


    /* SHOW FILTERED RESULTS */

    displayCases(filtered);

}

function clearFilters() {

activeFilters = {};

document.getElementById("globalSearch").value = "";

displayCases(allCases);

}



/* ESCAPE HTML */

function escapeHtml(value) {

if (
value === null ||
value === undefined
) {

return "";

}

return String(value)

.replace(/&/g, "&amp;")

.replace(/</g, "&lt;")

.replace(/>/g, "&gt;")

.replace(/"/g, "&quot;")

.replace(/'/g, "&#039;");

}


function openECourts(caseNo, firstParty, secondParty, advocate, courtName) {

    const decodedCaseNo = decodeURIComponent(caseNo);
    const decodedFirstParty = decodeURIComponent(firstParty);
    const decodedSecondParty = decodeURIComponent(secondParty);
    const decodedAdvocate = decodeURIComponent(advocate);
    const decodedCourtName = decodeURIComponent(courtName);

    let caseType = "";
    let caseNumber = "";
    let caseYear = "";

    /*
     * Example:
     * SCC no.90757/2024
     *
     * Case Type = SCC
     * Case Number = 90757
     * Year = 2024
     */

    const match = decodedCaseNo.match(
        /^([A-Za-z]+)\s*(?:no\.?|number)?\s*\.?\s*(\d+)\s*\/\s*(\d{4})$/i
    );

    if (match) {

        caseType = match[1].toUpperCase();
        caseNumber = match[2];
        caseYear = match[3];

    } else {

        alert(
            "Unable to automatically identify Case Type, Case Number and Year from:\n\n" +
            decodedCaseNo +
            "\n\nPlease check the Case No. format in the Legal MIS."
        );

        return;
    }


    const assistantWindow = window.open("", "_blank");
