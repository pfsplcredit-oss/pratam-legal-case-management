<!DOCTYPE html>
<html>
<head>
    <title>Pratam Legal Case Management System</title>
</head>

<body>

    <h1>Pratam Finserv</h1>
    <h2>Legal Case Management System</h2>

    <div id="login">
        <h3>Login</h3>

        <input type="email" id="email" placeholder="Email">
        <br><br>

        <input type="password" id="password" placeholder="Password">
        <br><br>

        <button onclick="login()">Login</button>

        <p id="loginMessage"></p>
    </div>

    <div id="system" style="display:none;">

        <h3>Search Case</h3>

        <input
            type="text"
            id="searchBox"
            placeholder="Loan No., Party Name, Case No. or CNR"
        >

        <button onclick="searchCases()">Search</button>
        <button onclick="showAllCases()">Show All Cases</button>
        <button onclick="logout()">Logout</button>

        <div id="cases"></div>

    </div>

<script>

const SUPABASE_URL = "https://tawykarkhepvtaxnxxjd.supabase.co";

const SUPABASE_KEY = "sb_publishable_UbXEMo3CGKj6LbSu98xfFg_rvf2-kn_";


async function login() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const response = await fetch(
        SUPABASE_URL + "/auth/v1/token?grant_type=password",
        {
            method: "POST",
            headers: {
                "apikey": SUPABASE_KEY,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        }
    );

    const data = await response.json();

    if (!response.ok) {

        document.getElementById("loginMessage").innerText =
            "Login failed. Please check your email and password.";

        return;
    }

    localStorage.setItem("access_token", data.access_token);

    document.getElementById("login").style.display = "none";
    document.getElementById("system").style.display = "block";

    showAllCases();
}


async function searchCases() {

    const searchText =
        document.getElementById("searchBox").value.trim();

    if (searchText === "") {

        document.getElementById("cases").innerHTML =
            "<p>Please enter something to search.</p>";

        return;
    }

    const token = localStorage.getItem("access_token");

    const url =
        SUPABASE_URL +
        "/rest/v1/legal_cases" +
        "?select=*" +
        "&or=" +
        "(loan_no.ilike.*" + encodeURIComponent(searchText) +
        "*,first_party.ilike.*" + encodeURIComponent(searchText) +
        "*,second_party.ilike.*" + encodeURIComponent(searchText) +
        "*,case_no.ilike.*" + encodeURIComponent(searchText) +
        "*,cnr_number.ilike.*" + encodeURIComponent(searchText) +
        ")";

    const response = await fetch(
        url,
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + token
            }
        }
    );

    const cases = await response.json();

    if (!response.ok) {

        document.getElementById("cases").innerHTML =
            "<p>Unable to search cases.</p>";

        return;
    }

    displayCases(cases);
}


async function showAllCases() {

    const token = localStorage.getItem("access_token");

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/legal_cases?select=*",
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + token
            }
        }
    );

    const cases = await response.json();

    if (!response.ok) {

        document.getElementById("cases").innerHTML =
            "<p>Unable to load cases.</p>";

        return;
    }

    displayCases(cases);
}


function displayCases(cases) {

    if (cases.length === 0) {

        document.getElementById("cases").innerHTML =
            "<p>No matching cases found.</p>";

        return;
    }

    let html =
        "<h2>Cases Found: " + cases.length + "</h2>";

    cases.forEach(function(caseData) {

        html += `
            <hr>

            <h3>Case Details</h3>

            <p><strong>Branch:</strong> ${caseData.branch || ""}</p>

            <p><strong>Loan No:</strong> ${caseData.loan_no || ""}</p>

            <p><strong>Disbursement Date:</strong> ${caseData.disbursement_date || ""}</p>

            <p><strong>Lender:</strong> ${caseData.lender || ""}</p>

            <p><strong>First Party:</strong> ${caseData.first_party || ""}</p>

            <p><strong>Second Party:</strong> ${caseData.second_party || ""}</p>

            <p><strong>Case No:</strong> ${caseData.case_no || ""}</p>

            <p><strong>E-Filing Date:</strong> ${caseData.e_filing_date || ""}</p>

            <p><strong>Filing Date:</strong> ${caseData.filing_date || ""}</p>

            <p><strong>Court Name:</strong> ${caseData.court_name || ""}</p>

            <p><strong>Advocate:</strong> ${caseData.advocate || ""}</p>

            <p><strong>Previous Date:</strong> ${caseData.previous_date || ""}</p>

            <p><strong>Next Date:</strong> ${caseData.next_date || ""}</p>

            <p><strong>Stage:</strong> ${caseData.stage || ""}</p>

            <p><strong>Current Status:</strong> ${caseData.current_status || ""}</p>

            <p><strong>Act:</strong> ${caseData.act || ""}</p>

            <p><strong>Section:</strong> ${caseData.section || ""}</p>

            <p><strong>CNR Number:</strong> ${caseData.cnr_number || ""}</p>

            <p><strong>eCourts Last Checked:</strong> ${caseData.ecourts_last_checked || ""}</p>

            <p><strong>eCourts Status:</strong> ${caseData.ecourts_status || ""}</p>

            <p><strong>Last Order Date:</strong> ${caseData.last_order_date || ""}</p>

            <p><strong>Last Order Details:</strong> ${caseData.last_order_details || ""}</p>

            <p><strong>Next Hearing Date:</strong> ${caseData.next_hearing_date || ""}</p>

            <p><strong>eCourts URL:</strong> ${caseData.ecourts_url || ""}</p>

            <p><strong>Updated By:</strong> ${caseData.updated_by || ""}</p>

            <p><strong>Updated On:</strong> ${caseData.updated_on || ""}</p>
        `;
    });

    document.getElementById("cases").innerHTML = html;
}


function logout() {

    localStorage.removeItem("access_token");

    document.getElementById("system").style.display = "none";

    document.getElementById("login").style.display = "block";

    document.getElementById("cases").innerHTML = "";
}

</script>

</body>
</html>
